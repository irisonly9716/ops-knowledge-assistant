# ============================================================================
#  Operations Knowledge Assistant -- local development infrastructure
#  Usage:  cp .env.example .env  &&  docker compose up -d
#
#  The four core docker compose concepts:
#    services    -- each service is one container
#    ports       -- "host port:container port", maps a container port onto your machine
#    volumes     -- data volumes, so database data survives container restarts
#    environment -- environment variables for the process in the container (initial passwords, settings)
# ============================================================================

services:

  # -------------------------------------------------------------------------
  # PostgreSQL + pgvector
  #   - holds both the structured business tables and the document vector table
  #   - the pgvector/pgvector image = official Postgres + the vector extension preinstalled
  #   - tables are not created here; the flyway service below does that
  # -------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: oka-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------------------
  # Flyway -- database schema migrations. A one-off job: it runs and exits, it is not a long-running service
  #   - V1__xxx.sql, V2__xxx.sql... in db/migration/ run in version order; applied ones are
  #     recorded in the flyway_schema_history table, so the next run only applies new ones
  #   - every docker compose up runs migrate once; with no new migrations it does nothing
  #   - a container of its own rather than part of Spring Boot: the schema is shared by the Java
  #     and the Python service and shouldn't belong to either; the mock data script doesn't need
  #     the Java backend running first either
  #   - migration status: docker compose run --rm flyway info
  # -------------------------------------------------------------------------
  flyway:
    image: flyway/flyway:13.10.3-alpine
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      # Fail on file names that don't match V<version>__<description>.sql. The default silently
      # skips them: V4_xxx.sql with one underscore missing would never run, and nobody would notice
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
      REDGATE_DISABLE_TELEMETRY: "true"   # turn off Flyway's anonymous usage statistics
    volumes:
      - ./db/migration:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # Redis -- query cache + conversation memory
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: oka-redis
    command: ["redis-server", "--appendonly", "yes"]   # AOF persistence on
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # -------------------------------------------------------------------------
  # Kafka -- the asynchronous queue between file uploads and document processing
  #   - KRaft mode: Kafka manages its own metadata, no separate Zookeeper
  #   - one broker is enough for local development
  #   - three listeners:
  #       PLAINTEXT  (:19092) container to container (kafka-ui uses this one)
  #       CONTROLLER (:9093)  internal, for KRaft elections
  #       EXTERNAL   (:9092)  programs on the host (Spring Boot / Python from the IDE)
  #   - a single broker, so every replication factor is 1
  # -------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.0
    container_name: oka-kafka
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      # Topic auto-creation off: topics are created explicitly by scripts/init_topics.py, so a
      # misspelled name never makes Kafka quietly create an unmanaged topic with default settings
      # (standard production practice)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  # -------------------------------------------------------------------------
  # Kafka UI -- browse topics / messages in the browser, for debugging (optional)
  #   open http://localhost:8080
  # -------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: oka-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
  kafka_data:
