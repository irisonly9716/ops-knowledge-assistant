# ============================================================================
#  Operations Knowledge Assistant —— 本地开发中间件
#  用法:  cp .env.example .env  &&  docker compose up -d
#
#  docker-compose 的四个核心概念(面试要能讲):
#    services    —— 每个 service 就是一个容器
#    ports       —— "宿主机端口:容器端口",把容器里的端口映射到你电脑上
#    volumes     —— 数据卷,让数据库数据在容器重启后不丢
#    environment —— 传给容器里进程的环境变量(初始密码、配置等)
# ============================================================================

services:

  # -------------------------------------------------------------------------
  # PostgreSQL + pgvector
  #   - 同时存"结构化业务表"和"文档向量表"
  #   - pgvector/pgvector 镜像 = 官方 Postgres + 预装 vector 扩展
  #   - 建表不在这里做,由下面的 flyway 服务负责
  # -------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: oka-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------------------
  # Flyway —— 数据库 schema 迁移。一次性任务:跑完就退出,不是常驻服务
  #   - db/migration/ 里的 V1__xxx.sql、V2__xxx.sql… 按版本号顺序执行;
  #     执行过的记在库里的 flyway_schema_history 表,下次只执行新增的
  #   - 每次 docker compose up 都会跑一次 migrate,没有新迁移就什么都不做
  #   - 单独一个容器、不放进 Spring Boot:schema 由 Java 和 Python 两个服务共用,
  #     不该归其中一个管;造数据脚本也不用先启动 Java 后端
  #   - 查看迁移状态:docker compose run --rm flyway info
  # -------------------------------------------------------------------------
  flyway:
    image: flyway/flyway:13.10.3-alpine
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      # 文件名不符合 V<版本>__<描述>.sql 时直接报错。默认是悄悄跳过,
      # 比如 V4_xxx.sql 少写一个下划线,这个迁移就永远不会执行,也没人发现
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
      REDGATE_DISABLE_TELEMETRY: "true"   # 关掉 Flyway 的匿名使用统计
    volumes:
      - ./db/migration:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # Redis —— 查询缓存 + 会话记忆
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: oka-redis
    command: ["redis-server", "--appendonly", "yes"]   # 开 AOF 持久化
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # -------------------------------------------------------------------------
  # Kafka —— 上传文件与文档处理之间的异步队列
  #   - KRaft 模式:Kafka 自己管元数据,不再需要单独的 Zookeeper
  #   - 只在本机开发用一个 broker 就够
  #   - 三个 listener:
  #       PLAINTEXT  (:19092) 容器之间连(kafka-ui 用这个)
  #       CONTROLLER (:9093)  KRaft 选举内部用
  #       EXTERNAL   (:9092)  宿主机上的程序(IDE 里的 Spring Boot / Python)连
  #   - 单 broker 所以各种副本因子都设成 1
  # -------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.0
    container_name: oka-kafka
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      # 关掉自动建 topic:强制走 scripts/init_topics.py 显式创建,
      # 避免拼错名字时 Kafka 悄悄用默认配置建一个没人管的 topic(生产标准做法)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  # -------------------------------------------------------------------------
  # Kafka UI —— 浏览器里看 topic / 消息,调试用(可选)
  #   打开 http://localhost:8080
  # -------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: oka-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
  kafka_data:
