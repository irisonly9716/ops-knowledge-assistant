# ============================================================================
#  Operations Knowledge Assistant —— 本地开发中间件
#  用法:  cp .env.example .env  &&  docker compose up -d
#
#  docker-compose 的四个核心概念(面试要能讲):
#    services    —— 每个 service 就是一个容器,这里起了 3 个
#    ports       —— "宿主机端口:容器端口",把容器里的端口映射到你电脑上
#    volumes     —— 数据卷,让数据库数据在容器重启后不丢
#    environment —— 传给容器里进程的环境变量(初始密码、配置等)
# ============================================================================

services:

  # -------------------------------------------------------------------------
  # PostgreSQL + pgvector
  #   - 同时存"结构化业务表"和"文档向量表"
  #   - pgvector/pgvector 镜像 = 官方 Postgres + 预装 vector 扩展
  #   - sql/01_init.sql 会在"数据库第一次创建时"自动执行一次
  # -------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: oka-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro   # 目录里的 *.sql 按文件名顺序执行
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------------------
  # Redis —— 查询缓存 + 会话记忆
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: oka-redis
    command: ["redis-server", "--appendonly", "yes"]   # 开 AOF 持久化
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # -------------------------------------------------------------------------
  # Kafka —— 上传文件与文档处理之间的异步队列
  #   - KRaft 模式:Kafka 自己管元数据,不再需要单独的 Zookeeper
  #   - 只在本机开发用一个 broker 就够
  #   - 三个 listener:
  #       PLAINTEXT  (:19092) 容器之间连(kafka-ui 用这个)
  #       CONTROLLER (:9093)  KRaft 选举内部用
  #       EXTERNAL   (:9092)  宿主机上的程序(IDE 里的 Spring Boot / Python)连
  #   - 单 broker 所以各种副本因子都设成 1
  # -------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.0
    container_name: oka-kafka
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"     # 开发方便;生产会关掉
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  # -------------------------------------------------------------------------
  # Kafka UI —— 浏览器里看 topic / 消息,调试用(可选)
  #   打开 http://localhost:8080
  # -------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: oka-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
  kafka_data:
