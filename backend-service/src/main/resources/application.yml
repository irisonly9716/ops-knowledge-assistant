spring:
  application:
    name: backend-service

  datasource:
    # ${VAR:默认值} —— 读不到 VAR 就用冒号后面的默认值。
    # VAR 现在真的能从仓库根目录的 .env 读到(见 config/DotenvEnvironmentPostProcessor.java——
    # Java 本身不认识 .env,这是我们自己补的)。冒号后面的默认值只是最后一道保险,
    # 正常情况下不会用到;生产环境要覆盖,应该设真正的操作系统环境变量
    # (优先级比 .env 高,见 DotenvEnvironmentPostProcessor 里 addLast 的说明)。
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ops_assistant}
    username: ${POSTGRES_USER:ops}
    # 密码故意【不给默认值】:没配置时启动直接报 "Could not resolve placeholder 'POSTGRES_PASSWORD'",
    # 比拿一个写死在仓库里(公开可见)的密码去连、再报一个让人摸不着头脑的认证失败要清楚。
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      # Day 5:sql/02_schema.sql 定稿了真正的 schema,换成 validate——
      # 启动时检查 Entity 跟数据库表是否一致,不一致直接报错,但绝不会自己改表结构。
      # "表长什么样"从此完全由 SQL 文件说了算。
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # Spring Boot 不会帮你猜序列化方式,必须显式配置,不然启动会报错要你选一个。
      # 用最朴素的字符串序列化,我们自己把 Java 对象转成 JSON 字符串再发——
      # 跟 llm-service 那边 Python 用 json.dumps() 发的消息格式完全一致,
      # 两边不用为了"Java 特有的对象格式"额外多写一层转换代码。
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # Day 7 实测发现:topic 不存在/Kafka 连不上时,send() 自己会阻塞 60 秒(Kafka 默认的
        # max.block.ms)才报错,HTTP 请求整整卡一分钟,占着一个 Tomcat 线程。
        # 三个超时要配套:delivery.timeout.ms 必须 >= request.timeout.ms + linger.ms,
        # 否则 Kafka 启动就拒绝这套配置。
        max.block.ms: 5000        # send() 等元数据(topic 是否存在、broker 地址)最多等 5 秒
        request.timeout.ms: 5000  # 单次请求 broker 的超时
        delivery.timeout.ms: 10000  # 从 send() 返回起,10 秒内一定给出"成功"或"失败"的确定结果

document:
  # 跟 llm-service 的 app/config.py 读的是同一个 .env 变量,单一数据源,
  # 不在这里重新拼一遍字符串(Day 3 就踩过这个坑)。
  upload-topic: ${DOC_UPLOAD_TOPIC:document-upload-events}
  # 下面两项是 Day 7 写测试时"逼"出来的:原先一个硬编码成 uploads,一个硬编码成 15 秒,
  # 结果测试要么往真实目录写文件,要么测"结果不确定"分支得真等 15 秒。
  # 变成配置项后,测试可以指到临时目录、把超时改成 300 毫秒。
  # 上传文件的存放根目录,backend 写、llm-service 读——两边读同一个 .env 变量 UPLOAD_DIR。
  # 默认 ../uploads 是相对【各服务自己的目录】的:backend-service/ 和 llm-service/ 是兄弟目录,
  # 各自从自己目录运行时,../uploads 恰好都指向仓库根的 uploads/,不用写死绝对路径。
  # (以后上 Docker,两个容器挂同一个共享卷,把这个变量设成挂载点即可;再往后换成 S3,
  #  消息里的 storageKey 不变,只换存储后端。)
  upload-dir: ${UPLOAD_DIR:../uploads}
  send-timeout-ms: 15000  # 等 Kafka 发送结果的上限;必须大于 delivery.timeout.ms(10 秒),见上面 producer 配置

server:
  # 8080 是 Spring Boot 默认端口,但我们的 kafka-ui 已经占了 8080,
  # 用 architecture.md 里规划好的 8081,避免端口冲突。
  port: ${BACKEND_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health # /actuator/env 只在调试时临时打开,平时不暴露(会连敏感配置项名字一起透出去)
