spring:
  application:
    name: backend-service

  datasource:
    # ${VAR:default} -- use the value after the colon when VAR is not set.
    # VAR really is read from .env at the repository root (see config/DotenvEnvironmentPostProcessor.java;
    # Java doesn't read .env by itself). The default after the colon is only a last resort and is
    # normally never used; to override in production, set a real operating-system environment
    # variable (it takes priority over .env, see addLast in DotenvEnvironmentPostProcessor).
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ops_assistant}
    username: ${POSTGRES_USER:ops}
    # Deliberately NO default password: without configuration, startup fails with "Could not resolve
    # placeholder 'POSTGRES_PASSWORD'", which is clearer than connecting with a password hard-coded
    # in a public repository and getting a puzzling authentication failure.
    password: ${POSTGRES_PASSWORD}

  jpa:
    # Spring Boot's default (true) holds a database connection until the response is written. Measured with /query
    # waiting 2 s on llm-service: 40 queries took 8.3 s, in batches the size of the pool of 10. With false: 2.3 s.
    open-in-view: false
    hibernate:
      # The Flyway migrations in db/migration/ are the only source of the schema, hence validate:
      # at startup Hibernate checks that the entities match the tables and fails if they don't,
      # but it never changes the schema itself. The migrations alone decide what tables look like.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  servlet:
    multipart:
      # Spring's default is 1 MB per file, too small for a PDF with images. Measured at this limit: a 20 MB
      # CSV (about 300,000 rows) takes about 5 s in the consumer, far below its time budget for one message.
      max-file-size: 20MB
      max-request-size: 21MB   # the file plus the form fields

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # Spring Boot doesn't guess the serialization; it must be configured explicitly.
      # Plain string serialization: we turn the Java object into a JSON string ourselves, the same
      # format Python's json.dumps() produces in llm-service, so neither side needs an extra layer
      # for a Java-specific object format.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # Measured: with the topic missing or Kafka unreachable, send() itself blocks for 60 seconds
        # (Kafka's default max.block.ms) before failing, holding the HTTP request and a Tomcat thread
        # for a full minute. The three timeouts go together: delivery.timeout.ms must be
        # >= request.timeout.ms + linger.ms, or Kafka rejects the configuration at startup.
        max.block.ms: 5000        # send() waits at most 5 seconds for metadata (does the topic exist, broker addresses)
        request.timeout.ms: 5000  # timeout of a single request to the broker
        delivery.timeout.ms: 10000  # within 10 seconds of send() returning, a definite "succeeded" or "failed"

document:
  # The same .env variable llm-service's app/config.py reads: one source, not a second copy of the string.
  upload-topic: ${DOC_UPLOAD_TOPIC:document-upload-events}
  # Root folder of uploaded files: the backend writes, llm-service reads; both read the .env variable UPLOAD_DIR.
  # Configurable so tests can point it at a temporary directory instead of the real folder.
  # The default ../uploads is relative to EACH SERVICE'S OWN FOLDER: backend-service/ and llm-service/
  # are siblings, so run from their own folders, ../uploads in both points at uploads/ at the
  # repository root, with no absolute path hard-coded.
  # (In Docker, both containers mount one shared volume and this variable is set to the mount
  #  point; later, with S3, the storageKey in the message stays and only the storage backend changes.)
  upload-dir: ${UPLOAD_DIR:../uploads}

# The query path. The token is shared with llm-service, which trusts the role and department it is sent only from
# a caller holding it. Empty if unset, so uploads keep working without it and /query answers 503 with the reason.
llm-service:
  base-url: ${LLM_SERVICE_URL:http://localhost:8000}
  internal-token: ${INTERNAL_SERVICE_TOKEN:}
  connect-timeout-ms: 1000
  # Above llm-service's budget for one query (12 s), so its own 504 with the reason arrives first
  read-timeout-ms: 14000

# Transactional outbox: an upload's event is written to the outbox table together with the upload, and
# OutboxRelay publishes it to Kafka afterwards (see db/migration/V6__outbox.sql)
outbox:
  relay:
    enabled: true          # tests switch the scheduler off and call the relay directly
  poll-interval-ms: 1000   # how often to look for unpublished messages (also the first backoff step)
  max-backoff-ms: 30000    # while Kafka is down, wait at most this long between attempts
  batch-size: 50           # messages per run (one transaction); a backlog is drained run after run
  send-timeout-ms: 15000   # upper bound for waiting on Kafka's acknowledgement; must exceed delivery.timeout.ms (10 s), see the producer settings above
  retention-days: 7        # published messages are kept this long for troubleshooting, then deleted
  cleanup-interval-ms: 3600000

server:
  # 8080 is Spring Boot's default port, but kafka-ui already uses it; 8081 is the port
  # planned in architecture.md.
  port: ${BACKEND_PORT:8081}
  tomcat:
    # How much of a refused request Tomcat still reads before answering. With the default of 2 MB, a client that
    # sends the whole body before reading the response never sees the 413 for an oversized file: measured, it gets
    # a dropped connection. Above this amount the connection is still dropped, so one client can't make the server
    # read without limit.
    max-swallow-size: 100MB

management:
  endpoints:
    web:
      exposure:
        include: health # /actuator/env is only opened temporarily while debugging (it exposes sensitive configuration names)
